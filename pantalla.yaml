esphome:
  name: pantalla
  friendly_name: Pantalla

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Pantalla Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# ============================================================
# PSRAM
# ============================================================

psram:
  mode: octal
  speed: 80MHz

# ============================================================
# RETROILUMINACIÓN
# ============================================================

output:
  - platform: ledc
    id: backlight_output
    frequency: 150Hz
    min_power: 0.01
    pin: 38
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Backlight"
    id: display_backlight
    output: backlight_output
    default_transition_length: 1s
    restore_mode: ALWAYS_ON

# ============================================================
# SPI
# ============================================================

spi:
  - id: lcd_spi
    clk_pin: 48
    mosi_pin: 47

# ============================================================
# I2C - TOUCH GT911
# ============================================================

i2c:
  - id: touchscreen_bus
    scl:
      ignore_strapping_warning: true
      number: 45
    sda: 19

# ============================================================
# PANTALLA ST7701S
# ============================================================

display:
  - platform: st7701s
    id: tft_display

    auto_clear_enabled: false
    color_order: RGB

    cs_pin: 39

    data_pins:
      blue: [4, 5, 6, 7, 15]
      green: [8, 20, 3, 46, 9, 10]
      red: [11, 12, 13, 14, 0]

    data_rate: 2MHz

    de_pin: 18

    dimensions:
      width: 480
      height: 480

    hsync_back_porch: 20
    hsync_front_porch: 10
    hsync_pin: 16
    hsync_pulse_width: 8

    invert_colors: false

    pclk_frequency: 12MHz
    pclk_inverted: false
    pclk_pin: 21

    spi_mode: MODE3

    update_interval: never

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pin: 17
    vsync_pulse_width: 8

# ============================================================
# TOUCH GT911
# ============================================================

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display

# ============================================================
