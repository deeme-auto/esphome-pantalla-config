# ============================================================
# SENSORES DE HOME ASSISTANT
# ============================================================

sensor:

  # ----------------------------------------------------------
  # Salón
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_salon
    entity_id: sensor.sonoff_snzb_02d_temperatura
    on_value:
      - lvgl.label.update:
          id: valor_temperatura_salon
          text:
            format: "%.1f °C"
            args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return x > 25;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_salon
                text_color: 0xFF5722
      - if:
          condition:
            - lambda: 'return x <= 25 && x >= 20;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_salon
                text_color: 0x4CAF50
      - if:
          condition:
            - lambda: 'return x < 20;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_salon
                text_color: 0x2196F3

  - platform: homeassistant
    id: humedad_salon
    entity_id: sensor.sonoff_snzb_02d_humedad
    on_value:
      - lvgl.label.update:
          id: valor_humedad_salon
          text:
            format: "%.0f %%"
            args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return x > 60;'
          then:
            - lvgl.label.update:
                id: valor_humedad_salon
                text_color: 0x03A9F4

  - platform: homeassistant
    id: iluminacion_salon
    entity_id: sensor.sensor_iluminacion_iluminancia
    on_value:
      - lvgl.label.update:
          id: valor_iluminacion_salon
          text:
            format: "%.0f lx"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Temperatura / humedad general
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_general
    entity_id: sensor.house_temperature
    on_value:
      - lvgl.label.update:
          id: valor_temperatura_general
          text:
            format: "%.1f °C"
            args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return x > 25;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_general
                text_color: 0xFF5722
      - if:
          condition:
            - lambda: 'return x <= 25 && x >= 20;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_general
                text_color: 0x4CAF50
      - if:
          condition:
            - lambda: 'return x < 20;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_general
                text_color: 0x2196F3

  - platform: homeassistant
    id: humedad_general
    entity_id: sensor.house_humidity
    on_value:
      - lvgl.label.update:
          id: valor_humedad_general
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Dormitorio
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_temperatura
    on_value:
      - lvgl.label.update:
          id: valor_temperatura_dormitorio
          text:
            format: "%.1f °C"
            args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return x > 25;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_dormitorio
                text_color: 0xFF5722
      - if:
          condition:
            - lambda: 'return x <= 25 && x >= 20;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_dormitorio
                text_color: 0x4CAF50
      - if:
          condition:
            - lambda: 'return x < 20;'
          then:
            - lvgl.label.update:
                id: valor_temperatura_dormitorio
                text_color: 0x2196F3

  - platform: homeassistant
    id: humedad_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_humedad
    on_value:
      - lvgl.label.update:
          id: valor_humedad_dormitorio
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Aire acondicionado
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_aire
    entity_id: sensor.sensor_aire_conectado_temperatura
    on_value:
      - lvgl.label.update:
          id: valor_temperatura_aire
          text:
            format: "%.1f °C"
            args: [ 'x' ]

  - platform: homeassistant
    id: humedad_aire
    entity_id: sensor.sensor_aire_conectado_humedad
    on_value:
      - lvgl.label.update:
          id: valor_humedad_aire
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Sensor de presencia / iluminación
  # ----------------------------------------------------------

  - platform: homeassistant
    id: iluminancia_presencia
    entity_id: sensor.smart_presence_sensor_iluminancia
    on_value:
      - lvgl.label.update:
          id: valor_iluminancia_presencia
          text:
            format: "%.0f lx"
            args: [ 'x' ]

# ============================================================
# BINARY SENSORS DE HOME ASSISTANT
# ============================================================

binary_sensor:

  # ----------------------------------------------------------
  # MOVIMIENTO
  # ----------------------------------------------------------

  - platform: homeassistant
    id: movimiento_salon
    entity_id: binary_sensor.e1_zoom_movimiento

    on_state:
      then:
        - lvgl.label.update:
            id: estado_movimiento
            text: !lambda |-
              return std::string(x ? "MOVIMIENTO" : "SIN MOVIMIENTO");
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: estado_movimiento
                  text_color: 0x4CAF50
        - if:
            condition:
              - lambda: 'return !x;'
            then:
              - lvgl.label.update:
                  id: estado_movimiento
                  text_color: 0x757575

  # ----------------------------------------------------------
  # PRESENCIA
  # ----------------------------------------------------------

  - platform: homeassistant
    id: presencia_casa
    entity_id: binary_sensor.sensor_presencia

    on_state:
      then:
        - lvgl.label.update:
            id: estado_presencia
            text: !lambda |-
              return std::string(x ? "PRESENCIA" : "SIN PRESENCIA");
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: estado_presencia
                  text_color: 0x4CAF50
        - if:
            condition:
              - lambda: 'return !x;'
            then:
              - lvgl.label.update:
                  id: estado_presencia
                  text_color: 0x757575

  # ----------------------------------------------------------
  # VENTANA SALÓN
  # ----------------------------------------------------------

  - platform: homeassistant
    id: ventana_salon
    entity_id: binary_sensor.ventana_salon

    on_state:
      then:
        - lvgl.label.update:
            id: estado_ventana_salon
            text: !lambda |-
              return std::string(x ? "ABIERTA" : "CERRADA");
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: estado_ventana_salon
                  text_color: 0xFF9800
        - if:
            condition:
              - lambda: 'return !x;'
            then:
              - lvgl.label.update:
                  id: estado_ventana_salon
                  text_color: 0x4CAF50

  # ----------------------------------------------------------
  # VENTANA DORMITORIO
  # ----------------------------------------------------------

  - platform: homeassistant
    id: ventana_dormitorio
    entity_id: binary_sensor.sensor_ventana_dormitorio

    on_state:
      then:
        - lvgl.label.update:
            id: estado_ventana_dormitorio
            text: !lambda |-
              return std::string(x ? "ABIERTA" : "CERRADA");
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: estado_ventana_dormitorio
                  text_color: 0xFF9800
        - if:
            condition:
              - lambda: 'return !x;'
            then:
              - lvgl.label.update:
                  id: estado_ventana_dormitorio
                  text_color: 0x4CAF50

# ============================================================
# LVGL
# ============================================================

lvgl:

  displays:
    - tft_display

  touchscreens:
    - touchscreen_id: tft_touch

  color_depth: 16

  buffer_size: 25%

  refresh_interval: 50ms

  theme:
    button:
      bg_color: bg_card
      bg_opa: 100%
      border_width: 0
      radius: 15
      text_color: text_primary

    label:
      text_color: text_primary

  pages:

    # ========================================================
    # PÁGINA PRINCIPAL
    # ========================================================

    - id: pagina_principal
      bg_color: bg_dark
      widgets:

        # ----------------------------------------------------
        # BARRA SUPERIOR - Hora y fecha
        # ----------------------------------------------------

        - container:
            id: barra_superior
            x: 0
            y: 0
            width: 480
            height: 50
            bg_color: bg_card
            bg_opa: 100%
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  id: hora_actual
                  x: 20
                  y: 15
                  text: "00:00"
                  text_font: nunito_20
                  text_color: text_primary
              - label:
                  id: fecha_actual
                  x: 300
                  y: 15
                  text: "--/--/----"
                  text_font: nunito_16
                  text_color: text_secondary

        # ----------------------------------------------------
        # FILA 1: Tarjetas principales
        # ----------------------------------------------------

        # Tarjeta Temperatura General
        - container:
            x: 10
            y: 60
            width: 150
            height: 100
            bg_color: bg_card
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "\U000F0392"
                  text_font: mdi_40
                  text_color: accent_color
              - label:
                  x: 60
                  y: 5
                  text: "TEMP"
                  text_font: nunito_14
                  text_color: text_secondary
              - label:
                  id: valor_temperatura_general
                  x: 60
                  y: 30
                  text: "--.- °C"
                  text_font: nunito_24
                  text_color: text_primary

        # Tarjeta Humedad General
        - container:
            x: 170
            y: 60
            width: 150
            height: 100
            bg_color: bg_card
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "\U000F03E3"
                  text_font: mdi_40
                  text_color: primary_color
              - label:
                  x: 60
                  y: 5
                  text: "HUMEDAD"
                  text_font: nunito_14
                  text_color: text_secondary
              - label:
                  id: valor_humedad_general
                  x: 60
                  y: 30
                  text: "-- %"
                  text_font: nunito_24
                  text_color: text_primary

        # Tarjeta Iluminación
        - container:
            x: 330
            y: 60
            width: 150
            height: 100
            bg_color: bg_card
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "\U000F0596"
                  text_font: mdi_40
                  text_color: accent_color
              - label:
                  x: 60
                  y: 5
                  text: "LUZ"
                  text_font: nunito_14
                  text_color: text_secondary
              - label:
                  id: valor_iluminacion_salon
                  x: 60
                  y: 30
                  text: "--- lx"
                  text_font: nunito_24
                  text_color: text_primary

        # ----------------------------------------------------
        # FILA 2: Salón y Dormitorio
        # ----------------------------------------------------

        # Tarjeta Salón
