# ============================================================
# NAVEGACIÓN POR SWIPE
# ============================================================

script:
  - id: swipe_left_handler
    then:
      - if:
          condition:
            - lambda: 'return id(pagina_principal).is_visible();'
          then:
            - lvgl.page.show: pagina_salon
      - if:
          condition:
            - lambda: 'return id(pagina_salon).is_visible();'
          then:
            - lvgl.page.show: pagina_dormitorio

  - id: swipe_right_handler
    then:
      - if:
          condition:
            - lambda: 'return id(pagina_dormitorio).is_visible();'
          then:
            - lvgl.page.show: pagina_salon
      - if:
          condition:
            - lambda: 'return id(pagina_salon).is_visible();'
          then:
            - lvgl.page.show: pagina_principal