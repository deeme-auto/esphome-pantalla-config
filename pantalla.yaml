                  text_font: mdi_40
                  text_color: primary_color
              - label:
                  x: 60
                  y: 5
                  text: "Salón:"
                  text_font: nunito_14
                  text_color: text_secondary
              - label:
                  id: estado_ventana_salon
                  x: 60
                  y: 25
                  text: "--"
                  text_font: nunito_16
                  text_color: text_primary
              - label:
                  x: 60
                  y: 45
