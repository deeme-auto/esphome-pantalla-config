esphome:
  name: pantalla
  friendly_name: Pantalla

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Pantalla Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# ============================================================
# PSRAM
# ============================================================

psram:
  mode: octal
  speed: 80MHz

# ============================================================
# RETROILUMINACIÓN
# ============================================================

output:
  - platform: ledc
    id: backlight_output
    frequency: 150Hz
    min_power: 0.01
    max_power: 0.70
    pin: 38
    zero_means_zero: true

light:
  # La propia luz del panel. `name` la publica en HA como
  # `light.backlight`, asi que desde la app se puede apagar de
  # verdad; el boton de la pantalla NO hace on/off, alterna entre
  # brillo alto y modo noche (ver script `alternar_brillo`).
  #
  # Motivo: si la pantalla queda a 0 no hay nada que pulsar, y
  # apagarla solo se podria revertir desde el movil. Con el modo
  # noche al 20% el panel sigue siendo operable y siempre se
  # puede volver al 100% tocandolo.
  #
  # DELIBERADAMENTE sin `on_state`: `restore_mode: ALWAYS_ON`
  # publica el estado durante el arranque, y `lvgl:` esta mas
  # abajo en el fichero, asi que un `on_state` intentaria
  # actualizar widgets que todavia no existen. La etiqueta se
  # refresca en su lugar desde `refrescar_toggles`, que corre en
  # el `on_load` de INICIO (ver nota en ese script).
  - platform: monochromatic
    name: "Backlight"
    id: display_backlight
    output: backlight_output
    default_transition_length: 1s
    restore_mode: ALWAYS_ON

# ============================================================
# SPI
# ============================================================

spi:
  - id: lcd_spi
    clk_pin: 48
    mosi_pin: 47

# ============================================================
# I2C - TOUCH GT911
# ============================================================

i2c:
  - id: touchscreen_bus
    scl:
      ignore_strapping_warning: true
      number: 45
    sda: 19

# ============================================================
# PANTALLA ST7701S
# ============================================================

display:
  - platform: st7701s
    id: tft_display

    auto_clear_enabled: false
    color_order: BGR

    cs_pin: 39

    data_pins:
      blue: [4, 5, 6, 7, 15]
      green: [8, 20, 3, 46, 9, 10]
      red: [11, 12, 13, 14, 0]

    data_rate: 2MHz

    de_pin: 18

    dimensions:
      width: 480
      height: 480

    hsync_back_porch: 20
    hsync_front_porch: 10
    hsync_pin: 16
    hsync_pulse_width: 8

    invert_colors: false

    pclk_frequency: 12MHz
    pclk_inverted: false
    pclk_pin: 21

    spi_mode: MODE3

    update_interval: never

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pin: 17
    vsync_pulse_width: 8

# ============================================================
# TOUCH GT911
# ============================================================

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display

# ============================================================
# HORA / FECHA (SNTP)
# ============================================================
# Actualiza el reloj y la fecha cada minuto. Ambos viven en la
# `top_layer` de LVGL, asi que se ven en todas las paginas.

time:
  - platform: sntp
    id: hora_tiempo
    timezone: Europe/Madrid
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: lbl_hora
              text: !lambda |-
                char buf[6];
                id(hora_tiempo).now().strftime(buf, 6, "%H:%M");
                return buf;
          - lvgl.label.update:
              id: lbl_fecha
              text: !lambda |-
                char buf[11];
                id(hora_tiempo).now().strftime(buf, 11, "%d/%m/%Y");
                return buf;

# ============================================================
# COLORES - PALETA "PIZARLA FRIA" (azul desaturado)
# ============================================================
# Toda la UI referencia estos IDs, no hay ni un solo hex suelto
# en la seccion LVGL ni en los lambdas de umbral (que usan
# `lv_color_make(id(c_xxx).r, ...)`).
#
# Este fichero es autonomo: la paleta va escrita aqui, sin
# `!include`, para que el ESPHome Builder no dependa de resolver
# ficheros externos.
#
# La variante calida esta en `pantalla-calida.yaml`. Es una copia
# de este fichero con el bloque de abajo sustituido; el resto es
# identico. Para usarla, cambia la ruta del Builder a ese fichero.

color:
  # ---- Fondo y superficies ----
  - id: c_bg
    hex: "0B1220"   # fondo de pagina
  - id: c_surface
    hex: "16202E"   # tarjetas
  - id: c_surface_hi
    hex: "1F2C3D"   # navegacion inactiva / superficies elevadas
  - id: c_accent_soft
    hex: "24374A"   # relleno sutil de acento
  - id: c_line
    hex: "2C3A4D"   # bordes, pistas de barras y arcos

  # ---- Texto ----
  - id: c_text
    hex: "DCE4EE"   # texto principal
  - id: c_text_dim
    hex: "8A99AD"   # etiquetas secundarias
  - id: c_muted
    hex: "5C6B80"   # inactivo / deshabilitado

  # ---- Acento ----
  - id: c_accent
    hex: "7FA7C7"   # azul frio
  - id: c_on_accent
    hex: "0B1220"   # texto sobre acento

  # ---- Estados (umbrales) ----
  - id: c_ok
    hex: "86B69B"   # verde salvia
  - id: c_warn
    hex: "C2B49A"   # arena apagada (nada de ambar)
  - id: c_bad
    hex: "B07A70"   # ladrido apagado (nada de rojo puro)
  - id: c_cool
    hex: "7FA7C7"   # frio: umbral bajo de temperatura

# ============================================================
# FUENTES
# ============================================================
# gfonts descarga el TTF completo de Roboto. Limitamos `glyphs`
# al ASCII imprimible + el signo de grado para que las fuentes
# ocupen lo minimo en flash (importante: son 5 fuentes).
#
# Sin acentos a proposito (ver commit 2d7d1a2): todas las
# etiquetas de la UI estan escritas en ASCII.

font:
  - file: "gfonts://Roboto"
    id: font_xs
    size: 22
    bpp: 4
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°'

  - file: "gfonts://Roboto"
    id: font_s
    size: 28
    bpp: 4
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°'

  - file: "gfonts://Roboto"
    id: font_m
    size: 36
    bpp: 4
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°'

  - file: "gfonts://Roboto"
    id: font_l
    size: 48
    bpp: 4
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°'

  - file: "gfonts://Roboto"
    id: font_xl
    size: 72
    bpp: 4
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°'

# ============================================================
# GLOBALS
# ============================================================

globals:
  - id: pagina_actual
    type: int
    restore_value: no
    initial_value: '0'

  # Porcentaje de brillo que la pantalla intenta mantener.
  # La luz se lee al entrar en INICIO (script `sincronizar_brillo`).
  - id: brillo_pct
    type: int
    restore_value: no
    initial_value: '100'

# ============================================================
# SENSORES DE HOME ASSISTANT
# ============================================================

sensor:

  # ----------------------------------------------------------
  # INICIO - Casa (promediadas)
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temp_casa
    entity_id: sensor.house_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_temp_casa
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.1f°C", x);
            return std::string(b);
          text_color: !lambda |-
            return x > 25.0f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                   : x < 20.0f ? lv_color_make(id(c_cool).r, id(c_cool).g, id(c_cool).b)
                               : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  - platform: homeassistant
    id: hum_casa
    entity_id: sensor.house_humidity
    on_value:
      - lvgl.label.update:
          id: lbl_hum_casa
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f%%", x);
            return std::string(b);
          text_color: !lambda |-
            return (x < 30.0f || x > 60.0f) ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b)
                                            : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  # ----------------------------------------------------------
  # INICIO - Clima exterior
  # ----------------------------------------------------------
  # La temperatura viene de un template sensor porque la
  # plataforma `homeassistant` no puede leer atributos.

  - platform: homeassistant
    id: temp_exterior
    entity_id: sensor.pantalla_temp_exterior
    on_value:
      - lvgl.label.update:
          id: lbl_temp_ext
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f°C", x);
            return std::string(b);


  # ----------------------------------------------------------
  # INICIO - Salon
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temp_salon
    entity_id: sensor.sonoff_snzb_02d_temperatura
    on_value:
      - lvgl.label.update:
          id: lbl_temp_salon
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.1f°C", x);
            return std::string(b);
          text_color: !lambda |-
            return x > 25.0f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                   : x < 20.0f ? lv_color_make(id(c_cool).r, id(c_cool).g, id(c_cool).b)
                               : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  - platform: homeassistant
    id: hum_salon
    entity_id: sensor.sonoff_snzb_02d_humedad
    on_value:
      - lvgl.label.update:
          id: lbl_hum_salon
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f%%", x);
            return std::string(b);

  # ----------------------------------------------------------
  # DORMITORIO
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temp_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_temperatura
    on_value:
      - lvgl.label.update:
          id: lbl_temp_dormitorio_hero
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.1f°C", x);
            return std::string(b);
          text_color: !lambda |-
            return x > 25.0f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                   : x < 20.0f ? lv_color_make(id(c_cool).r, id(c_cool).g, id(c_cool).b)
                               : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  - platform: homeassistant
    id: hum_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_humedad
    on_value:
      - lvgl.label.update:
          id: lbl_hum_dormitorio_hero
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f%%", x);
            return std::string(b);
          text_color: !lambda |-
            return (x < 30.0f || x > 60.0f) ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b)
                                            : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  - platform: homeassistant
    id: bateria_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_bateria
    on_value:
      - lvgl.label.update:
          id: lbl_bateria_dormitorio
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f%%", x);
            return std::string(b);
          text_color: !lambda |-
            return x < 20.0f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                   : x < 40.0f ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b)
                               : lv_color_make(id(c_text).r, id(c_text).g, id(c_text).b);

  # ----------------------------------------------------------
  # AIRE
  # ----------------------------------------------------------

  - platform: homeassistant
    id: co2_hab_peque
    entity_id: sensor.sensor_aire_conectado_dioxido_de_carbono
    on_value:
      - lvgl.label.update:
          id: lbl_co2
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f", x);
            return std::string(b);
          text_color: !lambda |-
            return x > 1000.0f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                   : x > 800.0f  ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b)
                                 : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);
      - lvgl.label.update:
          id: lbl_co2_estado
          text: !lambda |-
            return x > 1000.0f ? std::string("MAL")
                   : x > 800.0f  ? std::string("REGULAR")
                                 : std::string("BUENA");
      - lvgl.arc.update:
          id: arco_co2
          value: !lambda 'return x;'
          indicator:
            arc_color: !lambda |-
              return x > 1000.0f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                     : x > 800.0f  ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b)
                                   : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  - platform: homeassistant
    id: cov_hab_peque
    entity_id: sensor.sensor_aire_conectado_cov
    on_value:
      - lvgl.label.update:
          id: lbl_cov
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.1f", x);
            return std::string(b);
          text_color: !lambda |-
            return x > 3.0f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                   : x > 1.0f ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b)
                              : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  - platform: homeassistant
    id: formaldehido
    entity_id: sensor.sensor_aire_conectado_concentracion_de_formaldehido
    on_value:
      - lvgl.label.update:
          id: lbl_formaldehido
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.2f", x);
            return std::string(b);
          text_color: !lambda |-
            return x > 0.10f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                   : x > 0.05f ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b)
                               : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  - platform: homeassistant
    id: temp_aire
    entity_id: sensor.sensor_aire_conectado_temperatura
    on_value:
      - lvgl.label.update:
          id: lbl_temp_aire
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.1f°C", x);
            return std::string(b);
          text_color: !lambda |-
            return x > 25.0f ? lv_color_make(id(c_bad).r, id(c_bad).g, id(c_bad).b)
                   : x < 20.0f ? lv_color_make(id(c_cool).r, id(c_cool).g, id(c_cool).b)
                               : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

  - platform: homeassistant
    id: hum_aire
    entity_id: sensor.sensor_aire_conectado_humedad
    on_value:
      - lvgl.label.update:
          id: lbl_hum_aire
          text: !lambda |-
            char b[16];
            snprintf(b, sizeof(b), "%.0f%%", x);
            return std::string(b);
          text_color: !lambda |-
            return (x < 30.0f || x > 60.0f) ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b)
                                            : lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b);

# ============================================================
# TEXT SENSORS DE HOME ASSISTANT
# ============================================================
# weather.forecast_casa expone texto ("cloudy"), no un numero,
# asi que va en text_sensor: y no en sensor:.

text_sensor:

  - platform: homeassistant
    id: condicion_clima
    entity_id: weather.forecast_casa
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_clima_estado
          text: !lambda |-
            // HA devuelve el estado en minusculas y en ingles.
            // Lo pasamos a minusculas y buscamos en una tabla.
            std::string e = x;
            for (auto &ch : e) ch = tolower(ch);
            struct { const char *k; const char *v; } m[] = {
                {"thunderstorm", "TORMENTA"}, {"snowy-rainy", "NIEVE Y LLUVIA"},
                {"snowy",        "NIEVE"},    {"hail",         "GRANIZO"},
                {"pouring",      "LLUVIA FUERTE"}, {"lightning", "TORMENTA"},
                {"rainy",        "LLUVIA"},   {"partlycloudy", "PARCIAL"},
                {"windy",        "VIENTO"},   {"fog",          "NIEBLA"},
                {"cloudy",       "NUBLADO"},  {"sunny",        "SOL"},
                {"clear-night",  "NOCHE DESPEJADA"}, {"clear", "SOL"},
                {"exceptional",  "ALERTA"}};
            for (auto &i : m)
              if (e.find(i.k) != std::string::npos) return std::string(i.v);
            return e.empty() ? std::string("SIN DATOS") : e.substr(0, 10);

# ============================================================
# SENSORES BINARIOS DE HOME ASSISTANT
# ============================================================
# Cada chip de estado actualiza texto y color en un solo action.

binary_sensor:

  - platform: homeassistant
    id: presencia_casa
    entity_id: binary_sensor.sensor_presencia
    on_state:
      - lvgl.label.update:
          id: lbl_chip_presencia
          text: !lambda 'return x ? std::string("SI") : std::string("NO");'
          text_color: !lambda |-
            return x ? lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b) : lv_color_make(id(c_muted).r, id(c_muted).g, id(c_muted).b);

  - platform: homeassistant
    id: movimiento_salon
    entity_id: binary_sensor.e1_zoom_movimiento
    on_state:
      - lvgl.label.update:
          id: lbl_chip_movimiento
          text: !lambda 'return x ? std::string("SI") : std::string("NO");'
          text_color: !lambda |-
            return x ? lv_color_make(id(c_ok).r, id(c_ok).g, id(c_ok).b) : lv_color_make(id(c_muted).r, id(c_muted).g, id(c_muted).b);

  - platform: homeassistant
    id: puerta_entrada
    entity_id: binary_sensor.tz3000_bpkijo14_ts0203_2
    on_state:
      - lvgl.label.update:
          id: lbl_chip_puerta
          text: !lambda 'return x ? std::string("ABIERTA") : std::string("CERRADA");'
          text_color: !lambda |-
            return x ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b) : lv_color_make(id(c_muted).r, id(c_muted).g, id(c_muted).b);

  - platform: homeassistant
    id: ventana_salon
    entity_id: binary_sensor.ventana_salon
    on_state:
      - lvgl.label.update:
          id: lbl_chip_ventana
          text: !lambda 'return x ? std::string("ABIERTA") : std::string("CERRADA");'
          text_color: !lambda |-
            return x ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b) : lv_color_make(id(c_muted).r, id(c_muted).g, id(c_muted).b);

  - platform: homeassistant
    id: ventana_dormitorio
    entity_id: binary_sensor.sensor_ventana_dormitorio
    on_state:
      - lvgl.label.update:
          id: lbl_ventana_dormitorio
          text: !lambda 'return x ? std::string("ABIERTA") : std::string("CERRADA");'
          text_color: !lambda |-
            return x ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b) : lv_color_make(id(c_muted).r, id(c_muted).g, id(c_muted).b);
      - lvgl.label.update:
          id: lbl_ventana_dormitorio_estado
          text: !lambda 'return x ? std::string("ABIERTA") : std::string("CERRADA");'
          text_color: !lambda |-
            return x ? lv_color_make(id(c_warn).r, id(c_warn).g, id(c_warn).b) : lv_color_make(id(c_muted).r, id(c_muted).g, id(c_muted).b);

# ============================================================
# INTERRUPTORES (estado + control desde la pantalla)
# ============================================================
# `internal: true` -> no aparecen en HA, solo sirven de espejo
# controlable dentro de la pantalla.

switch:
  - platform: homeassistant
    id: sw_luz_salon
    entity_id: light.bombilla_salon
    internal: true
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.widget.update: {id: btn_luz_salon, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_luz_salon_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_luz_salon, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_luz_salon_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_luz_salon_txt
          text: !lambda 'return x ? std::string("ON") : std::string("OFF");'

  - platform: homeassistant
    id: sw_luz_habitacion
    entity_id: light.bombilla_habitacion
    internal: true
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.widget.update: {id: btn_luz_habitacion, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_luz_habitacion_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_luz_habitacion, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_luz_habitacion_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_luz_habitacion_txt
          text: !lambda 'return x ? std::string("ON") : std::string("OFF");'

  - platform: homeassistant
    id: sw_enchufe
    entity_id: switch.1001dfd86a_1
    internal: true
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.widget.update: {id: btn_enchufe, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_enchufe_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_enchufe, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_enchufe_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_enchufe_txt
          text: !lambda 'return x ? std::string("ON") : std::string("OFF");'

# ============================================================
# SCRIPTS
# ============================================================

script:

  # ----------------------------------------------------------
  # Navegacion: resalta el boton de la pagina activa.
  # Hay 5 paginas y 5 botones en la `top_layer`.
  # ----------------------------------------------------------
  - id: nav_reset
    then:
      - lvgl.widget.update: {id: nav_1, bg_color: c_surface_hi}
      - lvgl.label.update: {id: nav_1_txt, text_color: c_muted}
      - lvgl.widget.update: {id: nav_1_bar, bg_opa: 0%}
      - lvgl.widget.update: {id: nav_2, bg_color: c_surface_hi}
      - lvgl.label.update: {id: nav_2_txt, text_color: c_muted}
      - lvgl.widget.update: {id: nav_2_bar, bg_opa: 0%}
      - lvgl.widget.update: {id: nav_3, bg_color: c_surface_hi}
      - lvgl.label.update: {id: nav_3_txt, text_color: c_muted}
      - lvgl.widget.update: {id: nav_3_bar, bg_opa: 0%}
      - lvgl.widget.update: {id: nav_4, bg_color: c_surface_hi}
      - lvgl.label.update: {id: nav_4_txt, text_color: c_muted}
      - lvgl.widget.update: {id: nav_4_bar, bg_opa: 0%}
      - lvgl.widget.update: {id: nav_5, bg_color: c_surface_hi}
      - lvgl.label.update: {id: nav_5_txt, text_color: c_muted}
      - lvgl.widget.update: {id: nav_5_bar, bg_opa: 0%}

  # ----------------------------------------------------------
  # BRILLO DE LA PANTALLA
  # ----------------------------------------------------------
  # El boton no hace on/off: alterna entre brillo alto (100%) y
  # modo noche (20%). Un on/off real dejaria el panel en negro y
  # sin nada que pulsar, y solo se podria recuperar desde el movil.
  # El apagado real sigue disponible como `light.backlight` en HA.
  #
  # El nivel se guarda en el global `brillo_pct` y la etiqueta se
  # pinta con ESE valor, no con el estado real de la luz. Asi el
  # boton responde en el instante en que se pulsa, sin esperar a
  # los 700 ms de la transicion (que si no hacia que la etiqueta
  # se relea todavia al 100% y pareciera que no pasa nada).
  - id: refrescar_brillo
    then:
      - if:
          condition:
            lambda: return id(brillo_pct) <= 0;
          then:
            - lvgl.widget.update: {id: btn_brillo, bg_color: c_surface_hi}
            - lvgl.label.update:
                id: lbl_brillo_txt
                text_color: c_muted
                text: "OFF"
          else:
            - lvgl.widget.update: {id: btn_brillo, bg_color: c_accent_soft}
            - lvgl.label.update:
                id: lbl_brillo_txt
                text_color: c_accent
                text: !lambda |-
                  char b[8];
                  snprintf(b, sizeof(b), "%d%%", id(brillo_pct));
                  return b;

  - id: alternar_brillo
    then:
      - if:
          condition:
            lambda: return id(brillo_pct) > 50;
          then:
            - lambda: id(brillo_pct) = 20;
            - light.turn_on:
                id: display_backlight
                brightness: 20%
                transition_length: 700ms
          else:
            - lambda: id(brillo_pct) = 100;
            - light.turn_on:
                id: display_backlight
                brightness: 100%
                transition_length: 700ms
      - script.execute: refrescar_brillo

  # El brillo se puede cambiar tambien desde la app (HA), asi que
  # al entrar en INICIO se lee el valor real de la luz y se adopta.
  - id: sincronizar_brillo
    then:
      - lambda: |-
          const float b = id(display_backlight).remote_values.get_brightness();
          id(brillo_pct) = (int) (b * 100.0f + 0.5f);
      - script.execute: refrescar_brillo

  - id: nav_set
    parameters:
      activo: int
    then:
      - lambda: id(pagina_actual) = (int) activo;
      - script.execute: nav_reset
      - if:
          condition:
            lambda: return (int) activo == 1;
          then:
            - lvgl.widget.update: {id: nav_1, bg_color: c_accent_soft}
            - lvgl.label.update: {id: nav_1_txt, text_color: c_accent}
            - lvgl.widget.update: {id: nav_1_bar, bg_opa: 100%}
      - if:
          condition:
            lambda: return (int) activo == 2;
          then:
            - lvgl.widget.update: {id: nav_2, bg_color: c_accent_soft}
            - lvgl.label.update: {id: nav_2_txt, text_color: c_accent}
            - lvgl.widget.update: {id: nav_2_bar, bg_opa: 100%}
      - if:
          condition:
            lambda: return (int) activo == 3;
          then:
            - lvgl.widget.update: {id: nav_3, bg_color: c_accent_soft}
            - lvgl.label.update: {id: nav_3_txt, text_color: c_accent}
            - lvgl.widget.update: {id: nav_3_bar, bg_opa: 100%}
      - if:
          condition:
            lambda: return (int) activo == 4;
          then:
            - lvgl.widget.update: {id: nav_4, bg_color: c_accent_soft}
            - lvgl.label.update: {id: nav_4_txt, text_color: c_accent}
            - lvgl.widget.update: {id: nav_4_bar, bg_opa: 100%}
      - if:
          condition:
            lambda: return (int) activo == 5;
          then:
            - lvgl.widget.update: {id: nav_5, bg_color: c_accent_soft}
            - lvgl.label.update: {id: nav_5_txt, text_color: c_accent}
            - lvgl.widget.update: {id: nav_5_bar, bg_opa: 100%}

  # ----------------------------------------------------------
  # Ir a una pagina concreta, con transicion si es adyacente
  # ----------------------------------------------------------
  # Las paginas estan declaradas en orden, asi que `page.next` /
  # `page.previous` coinciden con el indice. Si el salto no es
  # adyacente se muestra directa (sin transicion).
  #
  # Los botones de la `top_layer` NO llaman a `nav_set`: cada
  # pagina lo hace en su `on_load`. Si se hiciera aqui, el
  # resaltado se quedaria en el boton pulsado en vez de en la
  # pagina a la que se llega.

  - id: ir_1
    then:
      - if:
          condition:
            lambda: return (int) id(pagina_actual) == 1;
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 260ms
          else:
            - lvgl.page.show: pagina_inicio

  - id: ir_2
    then:
      - if:
          condition:
            lambda: return (int) id(pagina_actual) == 1;
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 260ms
          else:
            - if:
                condition:
                  lambda: return (int) id(pagina_actual) == 2;
                then:
                  - lvgl.page.previous:
                      animation: MOVE_RIGHT
                      time: 260ms
                else:
                  - lvgl.page.show: pagina_casa

  - id: ir_3
    then:
      - if:
          condition:
            lambda: return (int) id(pagina_actual) == 2;
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 260ms
          else:
            - if:
                condition:
                  lambda: return (int) id(pagina_actual) == 3;
                then:
                  - lvgl.page.previous:
                      animation: MOVE_RIGHT
                      time: 260ms
                else:
                  - lvgl.page.show: pagina_dormitorio

  - id: ir_4
    then:
      - if:
          condition:
            lambda: return (int) id(pagina_actual) == 3;
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 260ms
          else:
            - if:
                condition:
                  lambda: return (int) id(pagina_actual) == 4;
                then:
                  - lvgl.page.previous:
                      animation: MOVE_RIGHT
                      time: 260ms
                else:
                  - lvgl.page.show: pagina_aire

  - id: ir_5
    then:
      - if:
          condition:
            lambda: return (int) id(pagina_actual) == 4;
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 260ms
          else:
            - lvgl.page.show: pagina_estado

  # ----------------------------------------------------------
  # Refresca los toggles al entrar en Inicio.
  # Necesario porque un `light` puede volver de `unavailable`
  # sin disparar `on_state` en el ESPHome.
  #
  # Aqui termina tambien `refrescar_brillo`. Es el unico sitio
  # que refresca el boton de la pantalla, a proposito: si lo
  # atamos al `on_state` de la luz, `restore_mode: ALWAYS_ON` lo
  # dispararia en el arranque, antes de que LVGL haya creado los
  # widgets. Como la etiqueta solo se ve en INICIO, refrescarla
  # al entrar en la pagina es suficiente.
  # ----------------------------------------------------------
  - id: refrescar_toggles
    then:
      - if:
          condition:
            lambda: return id(sw_luz_salon).state;
          then:
            - lvgl.widget.update: {id: btn_luz_salon, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_luz_salon_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_luz_salon, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_luz_salon_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_luz_salon_txt
          text: !lambda 'return id(sw_luz_salon).state ? std::string("ON") : std::string("OFF");'

      - if:
          condition:
            lambda: return id(sw_luz_habitacion).state;
          then:
            - lvgl.widget.update: {id: btn_luz_habitacion, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_luz_habitacion_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_luz_habitacion, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_luz_habitacion_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_luz_habitacion_txt
          text: !lambda 'return id(sw_luz_habitacion).state ? std::string("ON") : std::string("OFF");'

      - if:
          condition:
            lambda: return id(sw_enchufe).state;
          then:
            - lvgl.widget.update: {id: btn_enchufe, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_enchufe_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_enchufe, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_enchufe_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_enchufe_txt
          text: !lambda 'return id(sw_enchufe).state ? std::string("ON") : std::string("OFF");'

      - script.execute: sincronizar_brillo

# ============================================================
# LVGL
# ============================================================
# GEOMETRIA (pantalla 480x480)
#
#   0  +------------------------------+
#      |  top_layer: reloj + fecha    |  0..76
#   84 +------------------------------+
#      |                              |
#      |  contenido de la pagina      |  84..408
#      |                              |
#  412 +------------------------------+
#      |  top_layer: 5 botones nav    |  412..480
#  480 +------------------------------+
#
# Margen lateral de 16 px: el contenido va de x=16 a x=464.
#
# Las barras viven en `top_layer`, asi que se ven en las 5
# paginas y sobreviven a las transiciones.

lvgl:
  displays:
    - tft_display

  touchscreens:

  pages:
    - id: pagina_inicio
      bg_color: c_bg
      bg_opa: cover
      widgets:
        # 4 filas de 76 px (84..406) en la banda 84..408. Se ha
        # quitado el titulo "CONTROLES" para ganar los 27 px que
        # hacia falta: asi el ON/OFF se queda en font_l (48) en
        # vez de bajar a font_m (36). El boton del nav ya dice
        # "INICIO", asi que el titulo era redundante.
        - button:
            id: btn_luz_salon
            x: 16
            y: 84
            width: 448
            height: 76
            radius: 18
            border_width: 0
            bg_color: c_surface_hi
            widgets:
              - label:
                  x: 28
                  align: LEFT_MID
                  text_font: font_s
                  text_color: c_text_dim
                  text: "LUZ SALON"
              - label:
                  id: lbl_luz_salon_txt
                  x: -28
                  align: RIGHT_MID
                  text_font: font_l
                  text_color: c_muted
                  text: "OFF"
            on_click:
