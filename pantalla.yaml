esphome:
  name: pantalla
  friendly_name: Pantalla

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Pantalla Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# ============================================================
# PSRAM
# ============================================================

psram:
  mode: octal
  speed: 80MHz

# ============================================================
# RETROILUMINACIÓN
# ============================================================

output:
  - platform: ledc
    id: backlight_output
    frequency: 150Hz
    min_power: 0.01
    pin: 38
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Backlight"
    id: display_backlight
    output: backlight_output
    default_transition_length: 1s
    restore_mode: ALWAYS_ON

# ============================================================
# SPI
# ============================================================

spi:
  - id: lcd_spi
    clk_pin: 48
    mosi_pin: 47

# ============================================================
# I2C - TOUCH GT911
# ============================================================

i2c:
  - id: touchscreen_bus
    scl:
      ignore_strapping_warning: true
      number: 45
    sda: 19

# ============================================================
# PANTALLA ST7701S
# ============================================================

display:
  - platform: st7701s
    id: tft_display

    auto_clear_enabled: false
    color_order: RGB

    cs_pin: 39

    data_pins:
      blue: [4, 5, 6, 7, 15]
      green: [8, 20, 3, 46, 9, 10]
      red: [11, 12, 13, 14, 0]

    data_rate: 2MHz

    de_pin: 18

    dimensions:
      width: 480
      height: 480

    hsync_back_porch: 20
    hsync_front_porch: 10
    hsync_pin: 16
    hsync_pulse_width: 8

    invert_colors: false

    pclk_frequency: 12MHz
    pclk_inverted: false
    pclk_pin: 21

    spi_mode: MODE3

    update_interval: never

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pin: 17
    vsync_pulse_width: 8

# ============================================================
# TOUCH GT911
# ============================================================

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display

# ============================================================
# SENSORES DE HOME ASSISTANT
# ============================================================

sensor:

  # ----------------------------------------------------------
  # Salón
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_salon
    entity_id: sensor.sonoff_snzb_02d_temperatura
    on_value:
      - lvgl.label.update:
          id: valor_temperatura_salon
          text:
            format: "%.1f °C"
            args: [ 'x' ]

  - platform: homeassistant
    id: humedad_salon
    entity_id: sensor.sonoff_snzb_02d_humedad
    on_value:
      - lvgl.label.update:
          id: valor_humedad_salon
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  - platform: homeassistant
    id: iluminacion_salon
    entity_id: sensor.sensor_iluminacion_iluminancia
    on_value:
      - lvgl.label.update:
          id: valor_iluminacion_salon
          text:
            format: "%.0f lx"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Temperatura / humedad general
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_general
    entity_id: sensor.house_temperature
    on_value:
      - lvgl.label.update:
          id: valor_temperatura_general
          text:
            format: "%.1f °C"
            args: [ 'x' ]

  - platform: homeassistant
    id: humedad_general
    entity_id: sensor.house_humidity
    on_value:
      - lvgl.label.update:
          id: valor_humedad_general
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Dormitorio
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_temperatura
    on_value:
      - lvgl.label.update:
          id: valor_temperatura_dormitorio
          text:
            format: "%.1f °C"
            args: [ 'x' ]

  - platform: homeassistant
    id: humedad_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_humedad
    on_value:
      - lvgl.label.update:
          id: valor_humedad_dormitorio
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Aire acondicionado
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_aire
    entity_id: sensor.sensor_aire_conectado_temperatura
    on_value:
      - lvgl.label.update:
          id: valor_temperatura_aire
          text:
            format: "%.1f °C"
            args: [ 'x' ]

  - platform: homeassistant
    id: humedad_aire
    entity_id: sensor.sensor_aire_conectado_humedad
    on_value:
      - lvgl.label.update:
          id: valor_humedad_aire
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Sensor de presencia / iluminación
  # ----------------------------------------------------------

  - platform: homeassistant
    id: iluminancia_presencia
    entity_id: sensor.smart_presence_sensor_iluminancia
    on_value:
      - lvgl.label.update:
          id: valor_iluminancia_presencia
          text:
            format: "%.0f lx"
            args: [ 'x' ]

# ============================================================
# BINARY SENSORS DE HOME ASSISTANT
# ============================================================

binary_sensor:

  # ==========================================================
  # MOVIMIENTO
  # ==========================================================

  - platform: homeassistant
    id: movimiento_salon
    entity_id: binary_sensor.e1_zoom_movimiento

    on_state:
      then:
        - lvgl.label.update:
            id: estado_movimiento
            text: !lambda |-
              return std::string(x ? "MOVIMIENTO" : "SIN MOVIMIENTO");

  # ==========================================================
  # PRESENCIA
  # ==========================================================

  - platform: homeassistant
    id: presencia_casa
    entity_id: binary_sensor.sensor_presencia

    on_state:
      then:
        - lvgl.label.update:
            id: estado_presencia
            text: !lambda |-
              return std::string(x ? "PRESENCIA" : "SIN PRESENCIA");

  # ==========================================================
  # VENTANA SALÓN
  # ==========================================================

  - platform: homeassistant
    id: ventana_salon
    entity_id: binary_sensor.ventana_salon

    on_state:
      then:
        - lvgl.label.update:
            id: estado_ventana_salon
            text: !lambda |-
              return std::string(x ? "ABIERTA" : "CERRADA");

  # ==========================================================
  # VENTANA DORMITORIO
  # ==========================================================

  - platform: homeassistant
    id: ventana_dormitorio
    entity_id: binary_sensor.sensor_ventana_dormitorio

    on_state:
      then:
        - lvgl.label.update:
            id: estado_ventana_dormitorio
            text: !lambda |-
              return std::string(x ? "ABIERTA" : "CERRADA");

# ============================================================
# LVGL
# ============================================================

lvgl:

  displays:
    - tft_display

  touchscreens:
    - touchscreen_id: tft_touch

  color_depth: 16

  buffer_size: 25%

  refresh_interval: 50ms

  theme:

    button:
      bg_color: 0x202020
      bg_opa: 100%
      border_width: 1
      border_color: 0x404040
      radius: 12
      text_color: 0xFFFFFF

    label:
      text_color: 0xFFFFFF

  pages:

    # ========================================================
    # PÁGINA PRINCIPAL
    # ========================================================

    - id: pagina_principal

      bg_color: 0x101010

      widgets:

        # ----------------------------------------------------
        # TÍTULO
        # ----------------------------------------------------

        - label:
            id: titulo
            x: 20
            y: 12
            text: "CASA"
            text_font: montserrat_24
            text_color: 0xFFFFFF

        # ----------------------------------------------------
        # TEMPERATURA GENERAL
        # ----------------------------------------------------

        - label:
            x: 20
            y: 55
            text: "TEMPERATURA"
            text_font: montserrat_14
            text_color: 0xAAAAAA

        - label:
            id: valor_temperatura_general
            x: 20
            y: 75
            text: "--.- °C"
            text_font: montserrat_24
            text_color: 0xFF7043

        # ----------------------------------------------------
        # HUMEDAD GENERAL
        # ----------------------------------------------------

        - label:
            x: 180
            y: 55
            text: "HUMEDAD"
            text_font: montserrat_14
            text_color: 0xAAAAAA

        - label:
            id: valor_humedad_general
            x: 180
            y: 75
            text: "-- %"
            text_font: montserrat_24
            text_color: 0x42A5F5

        # ----------------------------------------------------
        # ILUMINACIÓN
        # ----------------------------------------------------

        - label:
            x: 340
            y: 55
            text: "LUZ"
            text_font: montserrat_14
            text_color: 0xAAAAAA

        - label:
            id: valor_iluminacion_salon
            x: 340
            y: 75
            text: "--- lx"
            text_font: montserrat_24
            text_color: 0xFFD54F

        # ====================================================
        # SALÓN
        # ====================================================

        - label:
            x: 20
            y: 125
            text: "SALÓN"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 20
            y: 160
            text: "Temperatura"
            text_font: montserrat_14
            text_color: 0x999999

        - label:
            id: valor_temperatura_salon
            x: 20
            y: 180
            text: "--.- °C"
            text_font: montserrat_22
            text_color: 0xFF7043

        - label:
            x: 20
            y: 215
            text: "Humedad"
            text_font: montserrat_14
            text_color: 0x999999

        - label:
            id: valor_humedad_salon
            x: 20
            y: 235
            text: "-- %"
            text_font: montserrat_22
            text_color: 0x42A5F5

        # ====================================================
        # DORMITORIO
        # ====================================================

        - label:
            x: 180
            y: 125
            text: "DORMITORIO"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 180
            y: 160
            text: "Temperatura"
            text_font: montserrat_14
            text_color: 0x999999

        - label:
            id: valor_temperatura_dormitorio
            x: 180
            y: 180
            text: "--.- °C"
            text_font: montserrat_22
            text_color: 0xFF7043

        - label:
            x: 180
            y: 215
            text: "Humedad"
            text_font: montserrat_14
            text_color: 0x999999

        - label:
            id: valor_humedad_dormitorio
            x: 180
            y: 235
