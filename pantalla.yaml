  # ------------------------------------------------------------
  # CAPA GLOBAL: reloj, fecha y barra de navegacion.
  # Vive en `top_layer`, asi que no se recrea al cambiar de pagina
  # y permanece fija durante las transiciones.
  # ------------------------------------------------------------
  top_layer:
    id: capa_global
    width: 480
    height: 480
    bg_opa: 0%
    pad_all: 0
    border_width: 0
    widgets:
      - obj:
          id: barra_top
          x: 0
          y: 0
          width: 480
