time:
  - platform: sntp
    id: hora_tiempo
    on_time_range:
      # Noche (22:00 - 07:30): brillo bajo
      - start: 22:00:00
        end: 07:30:00
        then:
          - light.turn_on:
              id: display_backlight
              brightness: 20%
              transition_length: 5s
      # Día (07:30 - 22:00): brillo normal
      - start: 07:30:00
        end: 22:00:00
        then:
          - light.turn_on:
              id: display_backlight
              brightness: 70%
              transition_length: 5s
