                  x: -28
                  align: RIGHT_MID
                  text_font: font_l
                  text_color: c_muted
                  text: "OFF"
            on_click:
              - switch.toggle: sw_luz_habitacion

        - button:
            id: btn_enchufe
            x: 16
            y: 248
            width: 448
            height: 76
            radius: 18
            border_width: 0
            bg_color: c_surface_hi
            widgets:
              - label:
                  x: 28
