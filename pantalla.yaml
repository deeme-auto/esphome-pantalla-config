                  text_font: font_s
                  text_color: c_text_dim
                  text: "PANTALLA"
              - label:
                  id: lbl_brillo_txt
                  x: -28
                  align: RIGHT_MID
                  text_font: font_l
                  text_color: c_muted
                  text: "OFF"
            on_click:
              - script.execute: alternar_brillo

      on_load:
        - script.execute:
            id: nav_set
            activo: 1
        - script.execute: refrescar_toggles

    - id: pagina_casa
      bg_color: c_bg
