esphome:
  name: pantalla
  friendly_name: Pantalla

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Pantalla Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# ============================================================
# PSRAM
# ============================================================

psram:
  mode: octal
  speed: 80MHz

# ============================================================
# RETROILUMINACIÓN
# ============================================================

output:
  - platform: ledc
    id: backlight_output
    frequency: 150Hz
    min_power: 0.01
    pin: 38
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Backlight"
    id: display_backlight
    output: backlight_output
    default_transition_length: 1s
    restore_mode: ALWAYS_ON

# ============================================================
# SPI
# ============================================================

spi:
  - id: lcd_spi
    clk_pin: 48
    mosi_pin: 47

# ============================================================
# I2C - TOUCH GT911
# ============================================================

i2c:
  - id: touchscreen_bus
    scl:
      ignore_strapping_warning: true
      number: 45
    sda: 19

# ============================================================
# PANTALLA ST7701S
# ============================================================

display:
  - platform: st7701s
    id: tft_display

    auto_clear_enabled: false
    color_order: BGR

    cs_pin: 39

    data_pins:
      blue: [4, 5, 6, 7, 15]
      green: [8, 20, 3, 46, 9, 10]
      red: [11, 12, 13, 14, 0]

    data_rate: 2MHz

    de_pin: 18

    dimensions:
      width: 480
      height: 480

    hsync_back_porch: 20
    hsync_front_porch: 10
    hsync_pin: 16
    hsync_pulse_width: 8

    invert_colors: false

    pclk_frequency: 12MHz
    pclk_inverted: false
    pclk_pin: 21

    spi_mode: MODE3

    update_interval: never

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pin: 17
    vsync_pulse_width: 8

# ============================================================
# TOUCH GT911
# ============================================================

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display

# ============================================================
# HORA / FECHA (SNTP)
# ============================================================

time:
  - platform: sntp
    id: hora_tiempo
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: hora_actual
              text: !lambda |-
                char buf[6];
                id(hora_tiempo).now().strftime(buf, 6, "%H:%M");
                return buf;
          - lvgl.label.update:
              id: fecha_actual
              text: !lambda |-
                char buf[11];
                id(hora_tiempo).now().strftime(buf, 11, "%d/%m/%Y");
                return buf;

# ============================================================
# COLORES PERSONALIZADOS
# ============================================================

color:
  - id: primary_color
    hex: "7A8FA6"
  - id: secondary_color
    hex: "8FA68F"
  - id: accent_color
    hex: "C2B49A"
  - id: error_color
    hex: "B07A70"
  - id: bg_dark
    hex: "1C1B19"
  - id: bg_card
    hex: "2B2927"
  - id: text_primary
    hex: "D9D5CF"
  - id: text_secondary
    hex: "8F8A82"
  - id: text_accent
    hex: "A9B8C7"

# ============================================================
# FUENTES (gfonts: proveedor nativo de ESPHome)
# ============================================================

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
  - file: "gfonts://Roboto"
    id: font_medium
    size: 20
  - file: "gfonts://Roboto"
    id: font_large
    size: 26
  - file: "gfonts://Roboto"
    id: font_title
    size: 32

# ============================================================
# SENSORES DE HOME ASSISTANT
# ============================================================

sensor:

  # ----------------------------------------------------------
  # Salón
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_salon
    entity_id: sensor.sonoff_snzb_02d_temperatura
    on_value:
      - lvgl.label.update:
          id: main_valor_temperatura_salon
          text:
            format: "%.1fC"
            args: [ 'x' ]
      - lvgl.label.update:
          id: detail_valor_temperatura_salon
          text:
            format: "%.1fC"
            args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return x > 25;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_salon
                text_color: 0xE8A5A0
            - lvgl.label.update:
                id: detail_valor_temperatura_salon
                text_color: 0xE8A5A0
      - if:
          condition:
            - lambda: 'return x <= 25 && x >= 20;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_salon
                text_color: 0x86B69B
            - lvgl.label.update:
                id: detail_valor_temperatura_salon
                text_color: 0x86B69B
      - if:
          condition:
            - lambda: 'return x < 20;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_salon
                text_color: 0x7FA7C7
            - lvgl.label.update:
                id: detail_valor_temperatura_salon
                text_color: 0x7FA7C7

  - platform: homeassistant
    id: humedad_salon
    entity_id: sensor.sonoff_snzb_02d_humedad
    on_value:
      - lvgl.label.update:
          id: main_valor_humedad_salon
          text:
            format: "%.0f %%"
            args: [ 'x' ]
      - lvgl.label.update:
          id: detail_valor_humedad_salon
          text:
            format: "%.0f %%"
            args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return x > 60;'
          then:
            - lvgl.label.update:
                id: main_valor_humedad_salon
                text_color: 0x7FA7C7
            - lvgl.label.update:
                id: detail_valor_humedad_salon
                text_color: 0x7FA7C7

  - platform: homeassistant
    id: iluminacion_salon
    entity_id: sensor.sensor_iluminacion_iluminancia
    on_value:
      - lvgl.label.update:
          id: main_valor_iluminacion_salon
          text:
            format: "%.0f lx"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Temperatura / humedad general
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_general
    entity_id: sensor.house_temperature
    on_value:
      - lvgl.label.update:
          id: main_valor_temperatura_general
          text:
            format: "%.1fC"
            args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return x > 25;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_general
                text_color: 0xE8A5A0
      - if:
          condition:
            - lambda: 'return x <= 25 && x >= 20;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_general
                text_color: 0x86B69B
      - if:
          condition:
            - lambda: 'return x < 20;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_general
                text_color: 0x7FA7C7

  - platform: homeassistant
    id: humedad_general
    entity_id: sensor.house_humidity
    on_value:
      - lvgl.label.update:
          id: main_valor_humedad_general
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Dormitorio
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_temperatura
    on_value:
      - lvgl.label.update:
          id: main_valor_temperatura_dormitorio
          text:
            format: "%.1fC"
            args: [ 'x' ]
      - lvgl.label.update:
          id: detail_valor_temperatura_dormitorio
          text:
            format: "%.1fC"
            args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return x > 25;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_dormitorio
                text_color: 0xE8A5A0
            - lvgl.label.update:
                id: detail_valor_temperatura_dormitorio
                text_color: 0xE8A5A0
      - if:
          condition:
            - lambda: 'return x <= 25 && x >= 20;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_dormitorio
                text_color: 0x86B69B
            - lvgl.label.update:
                id: detail_valor_temperatura_dormitorio
                text_color: 0x86B69B
      - if:
          condition:
            - lambda: 'return x < 20;'
          then:
            - lvgl.label.update:
                id: main_valor_temperatura_dormitorio
                text_color: 0x7FA7C7
            - lvgl.label.update:
                id: detail_valor_temperatura_dormitorio
                text_color: 0x7FA7C7

  - platform: homeassistant
    id: humedad_dormitorio
    entity_id: sensor.tze200_cirvgep4_ts0601_humedad
    on_value:
      - lvgl.label.update:
          id: main_valor_humedad_dormitorio
          text:
            format: "%.0f %%"
            args: [ 'x' ]
      - lvgl.label.update:
          id: detail_valor_humedad_dormitorio
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Aire acondicionado
  # ----------------------------------------------------------

  - platform: homeassistant
    id: temperatura_aire
    entity_id: sensor.sensor_aire_conectado_temperatura
    on_value:
      - lvgl.label.update:
          id: main_valor_temperatura_aire
          text:
            format: "%.1fC"
            args: [ 'x' ]

  - platform: homeassistant
    id: humedad_aire
    entity_id: sensor.sensor_aire_conectado_humedad
    on_value:
      - lvgl.label.update:
          id: main_valor_humedad_aire
          text:
            format: "%.0f %%"
            args: [ 'x' ]

  # ----------------------------------------------------------
  # Sensor de presencia / iluminación
  # ----------------------------------------------------------

  - platform: homeassistant
    id: iluminancia_presencia
    entity_id: sensor.smart_presence_sensor_iluminancia
    on_value:
      - lvgl.label.update:
          id: main_valor_iluminacion_salon
          text:
            format: "%.0f lx"
            args: [ 'x' ]

# ============================================================
# BINARY SENSORS DE HOME ASSISTANT
# ============================================================

binary_sensor:

  # ----------------------------------------------------------
  # MOVIMIENTO
  # ----------------------------------------------------------

  - platform: homeassistant
    id: movimiento_salon
    entity_id: binary_sensor.e1_zoom_movimiento

    on_state:
      then:
        - lvgl.label.update:
            id: main_estado_movimiento
            text: !lambda |-
              return std::string(x ? "MOVIMIENTO" : "SIN MOVIMIENTO");
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: main_estado_movimiento
                  text_color: 0x86B69B
        - if:
            condition:
              - lambda: 'return !x;'
            then:
              - lvgl.label.update:
                  id: main_estado_movimiento
                  text_color: 0x556070

  # ----------------------------------------------------------
  # PRESENCIA
  # ----------------------------------------------------------

  - platform: homeassistant
    id: presencia_casa
    entity_id: binary_sensor.sensor_presencia

    on_state:
      then:
        - lvgl.label.update:
            id: main_estado_presencia
            text: !lambda |-
              return std::string(x ? "PRESENCIA" : "SIN PRESENCIA");
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: main_estado_presencia
                  text_color: 0x86B69B
        - if:
            condition:
              - lambda: 'return !x;'
            then:
              - lvgl.label.update:
                  id: main_estado_presencia
                  text_color: 0x556070

  # ----------------------------------------------------------
  # VENTANA SALÓN
  # ----------------------------------------------------------

  - platform: homeassistant
    id: ventana_salon
    entity_id: binary_sensor.ventana_salon

    on_state:
      then:
        - lvgl.label.update:
            id: main_estado_ventana_salon
            text: !lambda |-
              return std::string(x ? "ABIERTA" : "CERRADA");
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: main_estado_ventana_salon
                  text_color: 0xB5BBC9
        - if:
            condition:
              - lambda: 'return !x;'
            then:
              - lvgl.label.update:
                  id: main_estado_ventana_salon
                  text_color: 0x86B69B

  # ----------------------------------------------------------
  # VENTANA DORMITORIO
  # ----------------------------------------------------------

  - platform: homeassistant
    id: ventana_dormitorio
    entity_id: binary_sensor.sensor_ventana_dormitorio

    on_state:
      then:
        - lvgl.label.update:
            id: main_estado_ventana_dormitorio
            text: !lambda |-
              return std::string(x ? "ABIERTA" : "CERRADA");
        - if:
            condition:
              - lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: main_estado_ventana_dormitorio
                  text_color: 0xB5BBC9
        - if:
            condition:
              - lambda: 'return !x;'
            then:
              - lvgl.label.update:
                  id: main_estado_ventana_dormitorio
                  text_color: 0x86B69B

# ============================================================
# LVGL
# ============================================================

lvgl:

  displays:
    - tft_display

  touchscreens:
    - touchscreen_id: tft_touch

  color_depth: 16

  buffer_size: 25%

  refresh_interval: 50ms

  theme:
    button:
      bg_color: 0x1E293B
      bg_opa: 100%
      border_width: 0
      radius: 15
      text_color: 0xE2E8F0
      text_font: font_medium

    label:
      text_color: 0xE2E8F0
      text_font: font_small

  pages:

    # ========================================================
    # PÁGINA PRINCIPAL
    # ========================================================

    - id: pagina_principal
      bg_color: 0x0F172A
      bg_opa: cover
      widgets:

        # ----------------------------------------------------
        # BARRA SUPERIOR
        # ----------------------------------------------------

        - container:
            id: barra_superior
            x: 0
            y: 0
            width: 480
            height: 50
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  id: hora_actual
                  text_font: font_medium
                  x: 20
                  y: 15
                  text: "00:00"
                  text_color: 0xE2E8F0
              - label:
                  id: fecha_actual
                  text_font: font_medium
                  x: 300
                  y: 15
                  text: "--/--/----"
                  text_color: 0x94A3B8

        # ----------------------------------------------------
        # FILA 1: Tarjetas principales
        # ----------------------------------------------------

        # Tarjeta Temperatura General
        - container:
            x: 10
            y: 60
            width: 150
            height: 100
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "TEMP"
                  text_color: 0x94A3B8
              - label:
                  id: main_valor_temperatura_general
                  text_font: font_large
                  x: 10
                  y: 30
                  text: "--.- C"
                  text_color: 0xE2E8F0

        # Tarjeta Humedad General
        - container:
            x: 170
            y: 60
            width: 150
            height: 100
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "HUMEDAD"
                  text_color: 0x94A3B8
              - label:
                  id: main_valor_humedad_general
                  text_font: font_large
                  x: 10
                  y: 30
                  text: "-- %"
                  text_color: 0xE2E8F0

        # Tarjeta Iluminación
        - container:
            x: 330
            y: 60
            width: 150
            height: 100
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "LUZ"
                  text_color: 0x94A3B8
              - label:
                  id: main_valor_iluminacion_salon
                  text_font: font_large
                  x: 10
                  y: 30
                  text: "--- lx"
                  text_color: 0xE2E8F0

        # ----------------------------------------------------
        # FILA 2: Salón y Dormitorio
        # ----------------------------------------------------

        # Tarjeta Salón
        - container:
            x: 10
            y: 170
            width: 230
            height: 120
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "Salon"
                  text_color: 0xE2E8F0
              - label:
                  x: 10
                  y: 35
                  text: "Temperatura"
                  text_color: 0x94A3B8
              - label:
                  id: main_valor_temperatura_salon
                  text_font: font_large
                  x: 10
                  y: 55
                  text: "--.- C"
                  text_color: 0xE2E8F0
              - label:
                  x: 120
                  y: 35
                  text: "Humedad"
                  text_color: 0x94A3B8
              - label:
                  id: main_valor_humedad_salon
                  text_font: font_large
                  x: 120
                  y: 55
                  text: "-- %"
                  text_color: 0xE2E8F0

        # Tarjeta Dormitorio
        - container:
            x: 250
            y: 170
            width: 230
            height: 120
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "Dormitorio"
                  text_color: 0xE2E8F0
              - label:
                  x: 10
                  y: 35
                  text: "Temperatura"
                  text_color: 0x94A3B8
              - label:
                  id: main_valor_temperatura_dormitorio
                  text_font: font_large
                  x: 10
                  y: 55
                  text: "--.- C"
                  text_color: 0xE2E8F0
              - label:
                  x: 120
                  y: 35
                  text: "Humedad"
                  text_color: 0x94A3B8
              - label:
                  id: main_valor_humedad_dormitorio
                  text_font: font_large
                  x: 120
                  y: 55
                  text: "-- %"
                  text_color: 0xE2E8F0

        # ----------------------------------------------------
        # FILA 3: Presencia, Ventanas, Aire
        # ----------------------------------------------------

        # Tarjeta Presencia
        - container:
            x: 10
            y: 300
            width: 150
            height: 80
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "PRESENCIA"
                  text_color: 0x94A3B8
              - label:
                  id: main_estado_presencia
                  text_font: font_medium
                  x: 10
                  y: 30
                  text: "SIN DATOS"
                  text_color: 0x94A3B8
              - label:
                  id: main_estado_movimiento
                  text_font: font_medium
                  x: 10
                  y: 52
                  text: "SIN DATOS"
                  text_color: 0x94A3B8

        # Tarjeta Ventanas
        - container:
            x: 170
            y: 300
            width: 150
            height: 80
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "VENTANAS"
                  text_color: 0x94A3B8
              - label:
                  x: 10
                  y: 25
                  text: "Salon:"
                  text_color: 0x94A3B8
              - label:
                  id: main_estado_ventana_salon
                  text_font: font_medium
                  x: 60
                  y: 25
                  text: "--"
                  text_color: 0xE2E8F0
              - label:
                  x: 10
                  y: 45
                  text: "Dorm:"
                  text_color: 0x94A3B8
              - label:
                  id: main_estado_ventana_dormitorio
                  text_font: font_medium
                  x: 60
                  y: 45
                  text: "--"
                  text_color: 0xE2E8F0

        # Tarjeta Aire
        - container:
            x: 330
            y: 300
            width: 150
            height: 80
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            pad_all: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "AIRE"
                  text_color: 0x94A3B8
              - label:
                  id: main_valor_temperatura_aire
                  text_font: font_large
                  x: 10
                  y: 25
                  text: "--.- C"
                  text_color: 0xE2E8F0
              - label:
                  id: main_valor_humedad_aire
                  text_font: font_large
                  x: 10
                  y: 45
                  text: "-- %"
                  text_color: 0x94A3B8

        # ----------------------------------------------------
        # FILA 4: Botones de control
        # ----------------------------------------------------

        - button:
            id: boton_luz_salon
            x: 10
            y: 390
            width: 150
            height: 80
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            widgets:
              - label:
                  x: 0
                  y: 0
                  align: CENTER
                  text: "Luz Salon"
                  text_color: 0xE2E8F0
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.bombilla_salon

        - button:
            id: boton_luz_habitacion
            x: 170
            y: 390
            width: 150
            height: 80
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            widgets:
              - label:
                  x: 0
                  y: 0
                  align: CENTER
                  text: "Habitacion"
                  text_color: 0xE2E8F0
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.bombilla_habitacion

        - button:
            id: boton_ventanas
            x: 330
            y: 390
            width: 150
            height: 80
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 15
            widgets:
              - label:
                  x: 0
                  y: 0
                  align: CENTER
                  text: "ENCHUFE"
                  text_color: 0xE2E8F0
            on_click:
              - homeassistant.action:
                  action: switch.toggle
                  data:
                    entity_id: switch.enchufe_chino_1

    # ========================================================
    # PÁGINA DE DETALLES - SALÓN
    # ========================================================

    - id: pagina_salon
      bg_color: 0x0F172A
      bg_opa: cover
      widgets:
        # Botón de vuelta
        - button:
            id: boton_volver_salon
            x: 10
            y: 10
            width: 100
            height: 50
            bg_color: 0x1E293B
            bg_opa: 100%
            radius: 10
            widgets:
              - label:
