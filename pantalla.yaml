# ============================================================
# SCRIPTS
# ============================================================

script:

  # ----------------------------------------------------------
  # Navegacion: resalta el boton de la pagina activa
  # ----------------------------------------------------------
  - id: nav_reset
    then:
      - lvgl.widget.update: {id: nav_1, bg_color: c_surface_hi}
      - lvgl.widget.update: {id: nav_1_txt, text_color: c_muted}
      - lvgl.widget.update: {id: nav_1_bar, bg_opa: 0%}
      - lvgl.widget.update: {id: nav_2, bg_color: c_surface_hi}
      - lvgl.widget.update: {id: nav_2_txt, text_color: c_muted}
      - lvgl.widget.update: {id: nav_2_bar, bg_opa: 0%}
      - lvgl.widget.update: {id: nav_3, bg_color: c_surface_hi}
      - lvgl.widget.update: {id: nav_3_txt, text_color: c_muted}
      - lvgl.widget.update: {id: nav_3_bar, bg_opa: 0%}

  - id: nav_set
    parameters:
      activo: int
    then:
      - lambda: id(pagina_actual) = (int) activo;
      - script.execute: nav_reset
      - if:
          condition:
            lambda: return (int) activo == 1;
          then:
            - lvgl.widget.update: {id: nav_1, bg_color: c_accent_soft}
            - lvgl.widget.update: {id: nav_1_txt, text_color: c_accent}
            - lvgl.widget.update: {id: nav_1_bar, bg_opa: 100%}
      - if:
          condition:
            lambda: return (int) activo == 2;
          then:
            - lvgl.widget.update: {id: nav_2, bg_color: c_accent_soft}
            - lvgl.widget.update: {id: nav_2_txt, text_color: c_accent}
            - lvgl.widget.update: {id: nav_2_bar, bg_opa: 100%}
      - if:
          condition:
            lambda: return (int) activo == 3;
          then:
            - lvgl.widget.update: {id: nav_3, bg_color: c_accent_soft}
            - lvgl.widget.update: {id: nav_3_txt, text_color: c_accent}
            - lvgl.widget.update: {id: nav_3_bar, bg_opa: 100%}

  # ----------------------------------------------------------
  # Ir a una pagina concreta, con transicion si es adyacente
  # ----------------------------------------------------------
  # Las paginas estan declaradas en orden, asi que `page.next` /
  # `page.previous` coinciden con el indice. Si el salto no es
  # adyacente se muestra directa (sin transicion).

  - id: ir_1
    then:
      - if:
          condition:
            lambda: return (int) id(pagina_actual) == 1;
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 260ms
          else:
            - lvgl.page.show: pagina_inicio

  - id: ir_2
    then:
      - if:
          condition:
            lambda: return (int) id(pagina_actual) == 1;
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 260ms
          else:
            - if:
                condition:
                  lambda: return (int) id(pagina_actual) == 2;
                then:
                  - lvgl.page.previous:
                      animation: MOVE_RIGHT
                      time: 260ms
                else:
                  - lvgl.page.show: pagina_dormitorio

  - id: ir_3
    then:
      - if:
          condition:
            lambda: return (int) id(pagina_actual) == 2;
          then:
            - lvgl.page.next:
                animation: MOVE_LEFT
                time: 260ms
          else:
            - lvgl.page.show: pagina_aire

  # ----------------------------------------------------------
  # Sincroniza los botones toggle con el estado real al arrancar
  # ----------------------------------------------------------
  - id: refrescar_toggles
    then:
      - if:
          condition:
            lambda: return id(sw_luz_salon).state;
          then:
            - lvgl.widget.update: {id: btn_luz_salon, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_luz_salon_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_luz_salon, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_luz_salon_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_luz_salon_txt
          text: !lambda 'return id(sw_luz_salon).state ? std::string("ON") : std::string("OFF");'

      - if:
          condition:
            lambda: return id(sw_luz_habitacion).state;
          then:
            - lvgl.widget.update: {id: btn_luz_habitacion, bg_color: c_accent_soft}
            - lvgl.widget.update: {id: btn_luz_dorm_det, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_luz_habitacion_txt, text_color: c_accent}
            - lvgl.label.update: {id: lbl_luz_dorm_det_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_luz_habitacion, bg_color: c_surface_hi}
            - lvgl.widget.update: {id: btn_luz_dorm_det, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_luz_habitacion_txt, text_color: c_muted}
            - lvgl.label.update: {id: lbl_luz_dorm_det_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_luz_habitacion_txt
          text: !lambda 'return id(sw_luz_habitacion).state ? std::string("ON") : std::string("OFF");'
      - lvgl.label.update:
          id: lbl_luz_dorm_det_txt
          text: !lambda 'return id(sw_luz_habitacion).state ? std::string("ON") : std::string("OFF");'

      - if:
          condition:
            lambda: return id(sw_enchufe).state;
          then:
            - lvgl.widget.update: {id: btn_enchufe, bg_color: c_accent_soft}
            - lvgl.label.update: {id: lbl_enchufe_txt, text_color: c_accent}
          else:
            - lvgl.widget.update: {id: btn_enchufe, bg_color: c_surface_hi}
            - lvgl.label.update: {id: lbl_enchufe_txt, text_color: c_muted}
      - lvgl.label.update:
          id: lbl_enchufe_txt
          text: !lambda 'return id(sw_enchufe).state ? std::string("ON") : std::string("OFF");'

# ============================================================
# LVGL
# ============================================================

lvgl:
  displays:
    - tft_display

  touchscreens:
    - touchscreen_id: tft_touch

  color_depth: 16
  buffer_size: 25%
  refresh_interval: 50ms

  # ------------------------------------------------------------
  # CAPA SUPERIOR GLOBAL
  # ------------------------------------------------------------
  # `top_layer` existe sobre TODAS las paginas, asi que la barra
  # de reloj y la de navegacion se declaran una sola vez y no hay
  # que repetirlas en cada pagina.

  top_layer:
    id: capa_global
    width: 480
    height: 480
    pad_all: 0
    bg_opa: 0%
    widgets:

      # ---- Barra superior: reloj + fecha ----
      - obj:
          id: barra_top
          x: 0
          y: 0
          width: 480
          height: 54
          bg_color: c_surface
          bg_opa: cover
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - label:
                id: lbl_hora
                x: 16
                y: 11
                text_font: font_l
                text_color: c_text
                text: "00:00"
            - label:
                id: lbl_fecha
                align: RIGHT_MID
                x: -16
                y: 0
                text_font: font_s
                text_color: c_text_dim
                text: "--/--/----"

      # ---- Barra de navegacion ----
      - obj:
          id: barra_nav
          x: 0
          y: 414
          width: 480
          height: 66
          bg_color: c_surface
          bg_opa: cover
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - button:
                id: nav_1
                x: 12
                y: 8
                width: 145
                height: 48
                radius: 14
                border_width: 0
                bg_color: c_surface_hi
                widgets:
                  - label:
                      id: nav_1_txt
                      align: CENTER
                      text_font: font_xs
                      text_color: c_muted
                      text: "INICIO"
                  - obj:
                      id: nav_1_bar
                      align: TOP_MID
                      y: 0
                      width: 26
                      height: 3
                      radius: 2
                      bg_color: c_accent
                      bg_opa: 0%
                      pad_all: 0
                      border_width: 0
                on_click:
                  - script.execute: ir_1

            - button:
                id: nav_2
                x: 168
                y: 8
                width: 145
                height: 48
                radius: 14
                border_width: 0
                bg_color: c_surface_hi
                widgets:
                  - label:
                      id: nav_2_txt
                      align: CENTER
                      text_font: font_xs
                      text_color: c_muted
                      text: "DORMITORIO"
                  - obj:
                      id: nav_2_bar
