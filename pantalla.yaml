                  x: 60
                  y: 35
                  text: "Temperatura"
                  text_font: nunito_14
                  text_color: text_secondary
              - label:
                  id: valor_temperatura_dormitorio
                  x: 60
                  y: 55
                  text: "--.- °C"
                  text_font: nunito_20
                  text_color: text_primary
              - label:
                  x: 160
                  y: 35
                  text: "Humedad"
                  text_font: nunito_14
                  text_color: text_secondary
              - label:
                  id: valor_humedad_dormitorio
                  x: 160
                  y: 55
                  text: "-- %"
                  text_font: nunito_20
